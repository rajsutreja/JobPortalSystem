# This is an example configuration file
# Copy this to application-dev.properties and application-prod.properties
# Fill in your actual values - DO NOT COMMIT REAL CREDENTIALS

### Database Configuration ###
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=JobPortalSystem;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YOUR_DATABASE_PASSWORD_HERE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

### Redis Configuration ###
spring.data.redis.url=redis://default:YOUR_REDIS_PASSWORD_HERE@your-redis-host:14571

### Email Configuration ###
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

### JWT Configuration ###
jwt.secret.key=YOUR_SECRET_KEY_HERE_MIN_32_CHARS

### Application Configuration ###
server.servlet.context-path=/jobportal
spring.application.name=JobPortalSystem
